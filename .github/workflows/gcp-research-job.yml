name: GCP Research job

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [dev, staging]
      job:
        required: true
        type: choice
        options: [cri-research, cri-backtest]
      args:
        description: arguments, comma-separated (e.g. --market,NGX)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          case "${{ inputs.environment }}" in dev) p=tiva-cri-dev-cda9;; staging) p=tiva-cri-stg-cda9;; esac
          echo "project=$p" >> "$GITHUB_OUTPUT"
          echo "ops_number=$(cat infra/terraform/OPS_PROJECT_NUMBER)" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ steps.cfg.outputs.ops_number }}/locations/global/workloadIdentityPools/github/providers/cri-repo
          service_account: cri-deployer@${{ steps.cfg.outputs.project }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          extra=()
          if [ -n "${{ inputs.args }}" ]; then extra=("--args=${{ inputs.args }}"); fi
          set +e
          gcloud run jobs execute ${{ inputs.job }} --project ${{ steps.cfg.outputs.project }} \
            --region europe-west1 --wait "${extra[@]}" 2>&1 | tee exec.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            # Failure diagnostics: error-severity entries of this execution only (tracebacks),
            # never INFO output, because Actions logs of this public repository are public.
            ex=$(grep -oE "${{ inputs.job }}-[a-z0-9]{5}" exec.log | head -n 1)
            if [ -n "$ex" ]; then
              gcloud logging read "resource.type=\"cloud_run_job\" AND labels.\"run.googleapis.com/execution_name\"=\"$ex\" AND severity>=ERROR" \
                --project ${{ steps.cfg.outputs.project }} --limit 60 --order asc --format='value(textPayload)' | cut -c1-400 || true
            fi
          fi
          exit $rc
