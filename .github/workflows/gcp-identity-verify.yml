name: GCP Identity Verification

# Proves, before the shared Terraform identity is retired, that each
# environment-specific identity authenticates through Workload Identity
# Federation from its own GitHub environment, reads its own state, plans
# without changes it did not expect, and cannot reach other environments.

on:
  workflow_dispatch:
  push:
    # Branch pushes only: a release-tag push must never deploy, apply or verify.
    branches: ['**']
    paths: ["infra/requests/identity-verify.json"]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging]
    name: verify (${{ matrix.env }})
    runs-on: ubuntu-latest
    environment: terraform-${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          echo "ops_number=$(cat infra/terraform/OPS_PROJECT_NUMBER)" >> "$GITHUB_OUTPUT"
          case "${{ matrix.env }}" in dev) echo "own=tiva-cri-dev-cda9" >> "$GITHUB_OUTPUT"; echo "other=tiva-cri-stg-cda9" >> "$GITHUB_OUTPUT";;
            staging) echo "own=tiva-cri-stg-cda9" >> "$GITHUB_OUTPUT"; echo "other=tiva-cri-dev-cda9" >> "$GITHUB_OUTPUT";;
            production) echo "own=tiva-cri-prd-cda9" >> "$GITHUB_OUTPUT"; echo "other=tiva-cri-stg-cda9" >> "$GITHUB_OUTPUT";; esac
          echo "sa=$([ "${{ matrix.env }}" = production ] && echo terraform-prod || echo terraform-${{ matrix.env }})" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ steps.cfg.outputs.ops_number }}/locations/global/workloadIdentityPools/github/providers/cri-repo
          service_account: ${{ steps.cfg.outputs.sa }}@tiva-cri-ops-cda9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Authenticated identity
        run: gcloud auth list --filter=status:ACTIVE --format='value(account)' | tee who.txt; grep -q "${{ steps.cfg.outputs.sa }}@" who.txt
      - name: Own state readable; plan succeeds
        working-directory: infra/terraform/envs/${{ matrix.env }}
        run: |
          terraform init -input=false
          terraform state list | wc -l | tee count.txt
          # Production is unprovisioned: its state may be empty; dev and staging must not be.
          [ "${{ matrix.env }}" = production ] || test "$(cat count.txt)" -gt 0
          terraform plan -input=false -lock=false -no-color -detailed-exitcode \
            -var "wif_pool_name=projects/${{ steps.cfg.outputs.ops_number }}/locations/global/workloadIdentityPools/github" \
            > plan.txt 2> plan.err || code=$?
          cat plan.err >&2
          grep -E '^Plan:|No changes' plan.txt || true
          test "${code:-0}" != "1"
      - name: Isolation (each probe must be DENIED; other failures are inconclusive and fail)
        run: |
          set -euo pipefail
          deny=infra/scripts/expect_denied.sh
          other=${{ steps.cfg.outputs.other }}
          $deny "read $other IAM" gcloud projects get-iam-policy "$other"
          for e in dev staging production; do
            [ "$e" = "${{ matrix.env }}" ] && continue
            $deny "list $e state bucket" gcloud storage ls "gs://tiva-cri-ops-cda9-tfstate-$e/"
          done
          $deny "list the retired shared state bucket" gcloud storage ls "gs://tiva-cri-ops-cda9-tfstate/"
          if [ "${{ matrix.env }}" != production ]; then
            $deny "read production IAM" gcloud projects get-iam-policy tiva-cri-prd-cda9
            $deny "read the production image repository policy" \
              gcloud artifacts repositories get-iam-policy cri-prod --project tiva-cri-ops-cda9 --location europe-west1
          fi
          echo "isolation OK for ${{ matrix.env }}"

  # Pre-merge gate: dev and staging (any branch). Post-merge gate: production,
  # which is impersonable only from refs/heads/main, so this job runs only there.
  verify-production:
    name: verify (production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: terraform-production
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          echo "ops_number=$(cat infra/terraform/OPS_PROJECT_NUMBER)" >> "$GITHUB_OUTPUT"
          case "production" in dev) echo "own=tiva-cri-dev-cda9" >> "$GITHUB_OUTPUT"; echo "other=tiva-cri-stg-cda9" >> "$GITHUB_OUTPUT";;
            staging) echo "own=tiva-cri-stg-cda9" >> "$GITHUB_OUTPUT"; echo "other=tiva-cri-dev-cda9" >> "$GITHUB_OUTPUT";;
            production) echo "own=tiva-cri-prd-cda9" >> "$GITHUB_OUTPUT"; echo "other=tiva-cri-stg-cda9" >> "$GITHUB_OUTPUT";; esac
          echo "sa=$([ "production" = production ] && echo terraform-prod || echo terraform-production)" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ steps.cfg.outputs.ops_number }}/locations/global/workloadIdentityPools/github/providers/cri-repo
          service_account: ${{ steps.cfg.outputs.sa }}@tiva-cri-ops-cda9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Authenticated identity
        run: gcloud auth list --filter=status:ACTIVE --format='value(account)' | tee who.txt; grep -q "${{ steps.cfg.outputs.sa }}@" who.txt
      - name: Own state readable; plan succeeds
        working-directory: infra/terraform/envs/production
        run: |
          terraform init -input=false
          terraform state list | wc -l | tee count.txt
          # Production is unprovisioned: its state may be empty; dev and staging must not be.
          [ "production" = production ] || test "$(cat count.txt)" -gt 0
          # Production is unprovisioned: no plan (its APIs and billing are off by design).
      - name: Production remains unprovisioned
        run: |
          set -uo pipefail
          # Empty list, or the API disabled (nothing can exist), are the only passing outcomes.
          none() {
            rc=0; out=$("$@" --project tiva-cri-prd-cda9 --format='value(name)' 2>err.txt) || rc=$?
            if [ $rc = 0 ]; then test -z "$out" || { echo "FAIL: production has: $out"; exit 1; }; return; fi
            grep -Eq 'SERVICE_DISABLED|has not been used in project|is disabled|API not enabled' err.txt ||
              { echo "FAIL: inconclusive: $*"; head -3 err.txt; exit 1; }
            echo "API disabled for: $*"
          }
          none gcloud run services list
          none gcloud sql instances list
          echo "no Cloud Run services or Cloud SQL instances in production"
      - name: Isolation (each probe must be DENIED; other failures are inconclusive and fail)
        run: |
          set -euo pipefail
          deny=infra/scripts/expect_denied.sh
          other=${{ steps.cfg.outputs.other }}
          $deny "read $other IAM" gcloud projects get-iam-policy "$other"
          for e in dev staging production; do
            [ "$e" = "production" ] && continue
            $deny "list $e state bucket" gcloud storage ls "gs://tiva-cri-ops-cda9-tfstate-$e/"
          done
          $deny "list the retired shared state bucket" gcloud storage ls "gs://tiva-cri-ops-cda9-tfstate/"
          if [ "production" != production ]; then
            $deny "read production IAM" gcloud projects get-iam-policy tiva-cri-prd-cda9
            $deny "read the production image repository policy" \
              gcloud artifacts repositories get-iam-policy cri-prod --project tiva-cri-ops-cda9 --location europe-west1
          fi
          echo "isolation OK for production"
