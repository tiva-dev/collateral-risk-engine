name: Candidate Lifecycle Validation

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        default: "45681534542"
  push:
    paths: ["infra/requests/validation.json"]

permissions:
  actions: read
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: [hist-US, hist-NGX, sens-US, sens-NGX, sim-US, sim-NGX, repay-US, repay-NGX, frontier-US, frontier-NGX]
    env:
      SOURCE_RUN: ${{ inputs.source_run_id || '45681534542' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: official-provider-validation-evidence
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: data
      - uses: actions/download-artifact@v4
        with:
          name: historical-data-snapshot
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: snapshots
      - name: Verify inputs against snapshot
        run: |
          snap=$(dirname "$(find snapshots -name SNAPSHOT.json | head -n 1)")
          python -m app.historical_data.snapshot verify "$snap"
      - name: Run
        run: |
          manifest=$(find data/simulation_results -name '*.manifest.json' | head -n 1)
          python -m research.methodology_lab.candidate_validation "$manifest" --part ${{ matrix.part }} --out out | tee out.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-validation-${{ matrix.part }}
          path: |
            out/**
            out.log
          retention-days: 90

  us-coverage-probe:
    # Free probes only: does a provider we already have deliver US daily bars
    # before July 2020 (March 2020)? Prints availability, never keys.
    runs-on: ubuntu-latest
    steps:
      - env:
          AK: ${{ secrets.ALPACA_API_KEY }}
          AS: ${{ secrets.ALPACA_SECRET_KEY }}
          AV: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          set +e
          for feed in sip iex; do
            r=$(curl -s -H "APCA-API-KEY-ID: $AK" -H "APCA-API-SECRET-KEY: $AS" \
              "https://data.alpaca.markets/v2/stocks/SPY/bars?timeframe=1Day&start=2018-01-02&end=2020-04-30&limit=1000&feed=$feed&adjustment=all")
            echo "alpaca feed=$feed: $(echo "$r" | jq -c '{n: (.bars|length), first: .bars[0].t, last: .bars[-1].t, message}')"
          done
          r=$(curl -s "https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=SPY&outputsize=full&apikey=$AV")
          echo "alphavantage full: $(echo "$r" | jq -c '{n: ((.["Time Series (Daily)"] // {})|length), oldest: ((.["Time Series (Daily)"] // {})|keys|min), info: (.Information // .Note // ."Error Message")}')"
