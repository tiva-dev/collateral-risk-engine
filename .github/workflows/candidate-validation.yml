name: Candidate Lifecycle Validation
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        default: '45681534542'
  push:
    # Branch pushes only: a release-tag push must never deploy, apply or verify.
    branches: ['**']
    paths:
    - infra/requests/validation.json
permissions:
  actions: read
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part:
        - hist-US
        - hist-NGX
        - sens-US
        - sens-NGX
        - sim-US
        - sim-NGX
        - repay-US
        - repay-NGX
        - frontier-US
        - frontier-NGX
        # Partitioned execution: a part runs as `shards` jobs (request field, default 1);
        # matrix entries beyond the requested count exit immediately.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
    - uses: actions/checkout@v4
    - id: req
      run: 'src=$(jq -r ''.source_run_id // "45681534542"'' infra/requests/validation.json 2>/dev/null || echo 45681534542)

        [ -n "${{ inputs.source_run_id }}" ] && src="${{ inputs.source_run_id }}"

        want=$(jq -r ''(.parts // null) | if . == null then "all" else join(",") end'' infra/requests/validation.json 2>/dev/null || echo all)

        run=true; [ "$want" != all ] && ! echo ",$want," | grep -q ",${{ matrix.part }}," && run=false

        n=$(jq -r ''.shards // 1'' infra/requests/validation.json 2>/dev/null || echo 1); [ "${{ matrix.shard }}" -ge "$n" ] && run=false

        echo "SHARD=${{ matrix.shard }}/$n" >> "$GITHUB_ENV"; echo "PATHS=$(jq -r ''.paths // 0'' infra/requests/validation.json)" >> "$GITHUB_ENV"

        echo "SOURCE_RUN=$src" >> "$GITHUB_ENV"; echo "run=$run" >> "$GITHUB_OUTPUT"

        '
    - if: steps.req.outputs.run != 'true'
      run: echo "part not requested"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
      if: steps.req.outputs.run == 'true'
    - run: pip install -r requirements.txt -c release/CRI-1.0.0-rc1/constraints.txt
      if: steps.req.outputs.run == 'true'
    - uses: actions/download-artifact@v4
      with:
        name: official-provider-validation-evidence
        run-id: ${{ env.SOURCE_RUN }}
        github-token: ${{ github.token }}
        path: data
      if: steps.req.outputs.run == 'true'
    - uses: actions/download-artifact@v4
      with:
        name: historical-data-snapshot
        run-id: ${{ env.SOURCE_RUN }}
        github-token: ${{ github.token }}
        path: snapshots
      if: steps.req.outputs.run == 'true'
    - name: Verify inputs against snapshot
      run: 'snap=$(dirname "$(find snapshots -name SNAPSHOT.json | head -n 1)")

        python -m app.historical_data.snapshot verify "$snap"

        '
      if: steps.req.outputs.run == 'true'
    - name: Run
      run: 'manifest=$(find data/simulation_results -name ''*.manifest.json'' | head -n 1)

        vset=$(jq -r ''.variant_set // "ablation"'' infra/requests/validation.json)

        python -m research.methodology_lab.candidate_validation "$manifest" --part ${{ matrix.part }} --variant-set "$vset" --shard "$SHARD" --paths "$PATHS" --out out | tee out.log

        '
      if: steps.req.outputs.run == 'true'
    - uses: actions/upload-artifact@v4
      if: always() && steps.req.outputs.run == 'true'
      with:
        name: candidate-validation-${{ matrix.part }}-${{ matrix.shard }}
        path: 'out/**

          out.log

          '
        retention-days: 90
  us-coverage-probe:
    runs-on: ubuntu-latest
    steps:
    - env:
        AK: ${{ secrets.ALPACA_API_KEY }}
        AS: ${{ secrets.ALPACA_SECRET_KEY }}
        AV: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      run: "set +e\nfor feed in sip iex; do\n  r=$(curl -s -H \"APCA-API-KEY-ID: $AK\" -H \"APCA-API-SECRET-KEY: $AS\" \\\n    \"https://data.alpaca.markets/v2/stocks/SPY/bars?timeframe=1Day&start=2018-01-02&end=2020-04-30&limit=1000&feed=$feed&adjustment=all\"\
        )\n  echo \"alpaca feed=$feed: $(echo \"$r\" | jq -c '{n: (.bars|length), first: .bars[0].t, last: .bars[-1].t, message}')\"\ndone\nr=$(curl -s \"https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=SPY&outputsize=full&apikey=$AV\"\
        )\necho \"alphavantage full: $(echo \"$r\" | jq -c '{n: ((.[\"Time Series (Daily)\"] // {})|length), oldest: ((.[\"Time Series (Daily)\"] // {})|keys|min), info: (.Information // .Note // .\"Error\
        \ Message\")}')\"\n"
