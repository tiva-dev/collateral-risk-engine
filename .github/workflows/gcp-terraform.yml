name: GCP Terraform

on:
  # Before these workflows reach the default branch they cannot be dispatched,
  # so a committed request file triggers them instead. Each run is therefore
  # tied to a reviewed commit that states exactly what was requested.
  push:
    # Branch pushes only (branches-ignore alone excludes tags): a release-tag push
    # must never deploy, apply or verify.
    branches-ignore: [main]
    paths: ["infra/requests/terraform.json"]
  workflow_dispatch:
    inputs:
      environment:
        description: dev | staging | production
        required: true
        type: choice
        options: [dev, staging, production]
      action:
        description: plan only, or plan and apply
        required: true
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.r.outputs.environment }}
      action: ${{ steps.r.outputs.action }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          case "${{ github.ref }}" in refs/tags/*) echo "::error::refusing to run from a tag ref (${{ github.ref }})"; exit 1;; esac
          if [ "${{ github.event_name }}" = "push" ]; then
            env=$(jq -r .environment infra/requests/terraform.json); act=$(jq -r .action infra/requests/terraform.json)
          else
            env="${{ inputs.environment }}"; act="${{ inputs.action }}"
          fi
          case "$env" in dev|staging|production) ;; *) echo "bad environment"; exit 1;; esac
          case "$act" in plan|apply) ;; *) echo "bad action"; exit 1;; esac
          # State-migration freeze: while infra/MIGRATION_FREEZE exists, no apply runs
          # anywhere (plan-only runs are allowed; they mutate nothing).
          if [ -f infra/MIGRATION_FREEZE ] && [ "$act" = "apply" ]; then
            echo "::error::Terraform apply is frozen: $(head -1 infra/MIGRATION_FREEZE)"; exit 1
          fi
          if [ "$env" = "production" ] && [ "$act" = "apply" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::production apply runs only from main"; exit 1
          fi
          echo "environment=$env" >> "$GITHUB_OUTPUT"; echo "action=$act" >> "$GITHUB_OUTPUT"

  terraform:
    needs: request
    runs-on: ubuntu-latest
    # The GitHub environment is what Workload Identity Federation trusts.
    # terraform-production carries required reviewers.
    environment: terraform-${{ needs.request.outputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ needs.request.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - id: ops
        working-directory: .
        run: echo "number=$(cat infra/terraform/OPS_PROJECT_NUMBER)" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ steps.ops.outputs.number }}/locations/global/workloadIdentityPools/github/providers/cri-repo
          service_account: ${{ needs.request.outputs.environment == 'production' && 'terraform-prod' || format('terraform-{0}', needs.request.outputs.environment) }}@tiva-cri-ops-cda9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform init -input=false
      - name: Plan
        run: |
          terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan \
            -var "wif_pool_name=projects/${{ steps.ops.outputs.number }}/locations/global/workloadIdentityPools/github" \
            | tee plan.txt
          terraform show -no-color tfplan | grep -E '^\s+# .* will be|^Plan:' | tee summary.txt
      - name: Apply
        if: needs.request.outputs.action == 'apply'
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan
      - name: Outputs
        if: needs.request.outputs.action == 'apply'
        run: terraform output -json | jq 'del(.[] | select(.sensitive)) | map_values(.value)'
